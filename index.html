<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kavoos Boloorhi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:wght@300;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #101212;
        --text-primary: #dfe0e2;
        --text-secondary: #cdcdcd;
        --text-body: #a0a0a0;
        --accent: #00ff85;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Saira", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      .name {
        font-family: "Saira", sans-serif;
        font-size: clamp(3rem, 10vw, 6rem);
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--text-primary);
        margin-bottom: 1.5rem;
        opacity: 0;
        transform: translateY(30px);
        animation: fadeUp 1s ease-out 0.2s forwards;
      }

      .tagline {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-weight: 300;
        color: var(--text-secondary);
        letter-spacing: 0.15em;
        text-transform: lowercase;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1s ease-out 0.5s forwards;
      }

      .tagline span {
        color: var(--accent);
      }

      .socials {
        margin-top: 2rem;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1s ease-out 0.8s forwards;
      }

      .socials a {
        display: inline-block;
        color: var(--text-secondary);
        transition: color 0.2s ease, transform 0.2s ease;
      }

      .socials a:hover {
        color: var(--accent);
        transform: scale(1.1);
      }

      .socials svg {
        width: 24px;
        height: 24px;
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1 class="name">Kavoos Boloorhi</h1>
      <p class="tagline">
        passionate <span>front-end</span> / <span>mobile</span> developer
      </p>
      <div class="socials">
        <a
          href="https://www.linkedin.com/in/kavoosboloorchi/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
            />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
